<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart – My HandStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div id="container">
        <div id="navigationBar">
            <div id="search">
                <input type="text" placeholder="Search">
                <button id="searchButton"><i class="fa fa-search"></i></button>
            </div>
            <div id="storeName">
                <h1 id="heading"> My HandStore </h1>
            </div>
            <div id="links">
                <a href="index.html"> Home </a>
                <a href="cart.html"> Your cart </a>
                <a href="contact.html"> Contact </a>
            </div>
        </div>

        <div id="cart-wrapper">
            <div id="cart-section">
                <h2 id="cart-title"><i class="fa fa-shopping-cart"></i> Your Cart</h2>
                <div id="empty-cart">
                    <div id="empty-cart-icon"><i class="fa fa-shopping-cart"></i></div>
                    <h3>Your cart is empty</h3>
                    <p>Looks like you haven't added anything yet.</p>
                    <a href="index.html"><i class="fa fa-arrow-left"></i> Browse Products</a>
                </div>
            </div>

            <div id="order-summary">
                <h2><i class="fa fa-receipt"></i> Order Summary</h2>
                <div id="summary-items"></div>
                <div id="summary-divider"></div>
                <div id="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">$0</span>
                </div>
                <div id="summary-row-shipping">
                    <span>Shipping</span>
                    <span class="free-ship">FREE</span>
                </div>
                <div id="summary-total-row">
                    <span>Total</span>
                    <span id="summary-total">$0</span>
                </div>
                <button id="checkout-btn"><i class="fa fa-lock"></i> Proceed to Checkout</button>
                <a href="index.html" id="continue-shopping"><i class="fa fa-arrow-left"></i> Continue Shopping</a>
            </div>
        </div>

        <div id="footer">
            <h2> My HandStore </h2>
            <a href="contact.html"> Contact us </a>
            <h4> © 2026 My HandStore. All rights reserved. </h4>
        </div>
    </div>
    <script src="cart.js"></script>
</body>
</html>
